openapi: 3.1.0
info:
  title: UniEnroll API and Integration Contract
  version: 1.0.0
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  description: |
    Shared contract for course enrollment operations and the outbound
    enrollment.changed webhook. Eligibility decisions are deterministic;
    AI is used only to explain failed rules.
servers:
  - url: https://unienroll-backend.team03-enrollment.workers.dev/api
    description: Deployed Worker

security:
  - bearerAuth: []
paths:
  /external/student-identity/me:
    get:
      summary: Verify the authenticated student with Student Identity Team 01
      description: |
        Uses the authenticated UniEnroll student's 10-digit student code to request consented
        claims from Student Identity. Enrollment is enabled in the web application only when
        both verified and profile_complete are true. The partner service key remains server-side.
      operationId: verifyMyStudentIdentity
      responses:
        '200':
          description: Student Identity claims were retrieved and normalized
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [provider, student_id, verified, name, profile_complete, missing_fields, skills, can_enroll, checked_at, duration_ms]
                    properties:
                      provider: { type: string, const: Student Identity Team 01 }
                      student_id: { type: string, pattern: '^\d{10}$', example: '6731503119' }
                      verified: { type: boolean }
                      name: { type: string }
                      profile_complete: { type: boolean }
                      missing_fields:
                        type: array
                        items: { type: string }
                      skills:
                        type: array
                        items: { type: string }
                      can_enroll: { type: boolean }
                      checked_at: { type: string, format: date-time }
                      duration_ms: { type: integer, minimum: 0 }
        '400':
          description: The local account does not use a 10-digit student ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: Student Identity rejected the request, was unavailable, or returned an invalid response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Student Identity service key is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /enrollments/me:
    get:
      summary: List the authenticated student's active and historical enrollments
      operationId: listMyEnrollments
      responses:
        '200':
          description: Enrollment list
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  total: { type: integer, minimum: 0 }
                  student_id: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Enrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sections/{id}/availability:
    get:
      summary: Read current section capacity
      operationId: getSectionAvailability
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Current seat availability
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    $ref: '#/components/schemas/Availability'
        '404': { $ref: '#/components/responses/NotFound' }
  /enrollments:
    post:
      summary: Add a section
      description: |
        An optional Idempotency-Key makes retries replay-safe. Deterministic rules check duplicate
        enrollment, prerequisites, semester credit limit, schedule conflict,
        and capacity. Under contention, the first request that commits wins.
      operationId: createEnrollment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section_id]
              properties:
                section_id: { type: integer, minimum: 1, example: 2 }
      responses:
        '201':
          description: Enrollment created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Enrollment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Active enrollment already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Academic rule or capacity rejection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleRejection' }
              examples:
                lostLastSeat:
                  value:
                    success: false
                    error_code: ERR_CAPACITY_FULL
                    error: The last available seat was taken by another request that committed first.
                    details:
                      available_seats: 0
                      contention_policy: FIRST_COMMITTED_REQUEST_WINS
                      retryable: false
                prerequisite:
                  value:
                    success: false
                    error_code: ERR_PREREQUISITE_NOT_MET
                    error: Complete CS101 with grade C or better before enrolling in CS202.
                    explanation: Complete CS101 with grade C or better before enrolling in CS202.
                    explanation_source: DETERMINISTIC_FALLBACK
                    failed_rules:
                      - code: ERR_PREREQUISITE_NOT_MET
                        message: Complete CS101 with grade C or better before enrolling in CS202.
                        details:
                          required_course: CS101
                          minimum_grade: C
  /enrollments/{id}:
    patch:
      summary: Atomically swap an enrollment to another section
      operationId: swapEnrollmentSection
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [section_id]
              properties:
                section_id: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Section swapped
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Enrollment' }
        '400':
          description: Invalid swap request; PATCH accepts only a positive section_id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Enrollment is inactive, changed concurrently, or already belongs to the target section
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Target section is full
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Drop an enrollment and return its seat
      operationId: dropEnrollment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Enrollment dropped
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /enrollments/{id}/withdraw:
    post:
      summary: Withdraw with grade W and return the seat
      operationId: withdrawEnrollment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Enrollment withdrawn
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Enrollment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /overrides:
    post:
      summary: Create a staff-only enrollment override
      operationId: createOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section_id, override_type, reason]
              properties:
                student_id: { type: integer, minimum: 1 }
                student_code: { type: string }
                section_id: { type: integer, minimum: 1 }
                override_type:
                  type: string
                  enum: [CAPACITY, PREREQUISITE, LATE_ADD, SPECIAL_PERMISSION]
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: Override and enrollment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      override_id: { type: integer }
                      enrollment_id: { type: integer }
        '403':
          description: Caller is not staff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error_code: ERR_UNAUTHORIZED_OVERRIDE_AUTHORITY
                error: Only staff can grant enrollment overrides
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/logs:
    get:
      summary: List webhook audit logs (staff only)
      operationId: listWebhookLogs
      responses:
        '200':
          description: Webhook audit records
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks/retry-pending:
    post:
      summary: Retry durable pending or failed webhook events (staff only)
      operationId: retryPendingWebhooks
      responses:
        '200':
          description: Delivery batch processed
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: Partner webhook delivery is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /webhooks/incoming:
    post:
      summary: Receive a partner webhook
      operationId: receivePartnerWebhook
      security: []
      parameters:
        - name: X-Webhook-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Webhook verified and logged }
        '401': { $ref: '#/components/responses/Unauthorized' }
webhooks:
  enrollmentChanged:
    post:
      summary: Idempotent enrollment state-change event
      operationId: receiveEnrollmentChanged
      description: |
        Sent to PARTNER_WEBHOOK_URL. The same event_id is reused for all retry
        attempts, so consumers MUST accept duplicates and deduplicate by
        event_id. UniEnroll signs the raw JSON body with HMAC-SHA256 using
        WEBHOOK_SIGNING_SECRET and sends it in X-UniEnroll-Signature.
      parameters:
        - name: X-UniEnroll-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
        - name: X-UniEnroll-Event
          in: header
          required: true
          schema:
            type: string
            enum: [enrollment.created, enrollment.swapped, enrollment.dropped, enrollment.withdrawn, enrollment.overridden]
        - name: X-UniEnroll-Event-Id
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentChangedEvent' }
      responses:
        '2XX':
          description: Event accepted. A duplicate event_id should also return success.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Unique key for one logical add request. Keys are scoped to the authenticated
        actor, HTTP method, and request path. Concurrent identical requests replay one
        canonical response; reuse with a different body returns HTTP 409.
      schema: { type: string, minLength: 8, maxLength: 255 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated caller lacks permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Enrollment:
      type: object
      required: [id, student_id, section_id, status]
      properties:
        id: { type: integer }
        student_id: { type: integer }
        section_id: { type: integer }
        status:
          type: string
          enum: [ENROLLED, DROPPED, WITHDRAWN, OVERRIDDEN]
        enrolled_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        withdrawal_reason: { type: [string, 'null'] }
    Availability:
      type: object
      properties:
        section_id: { type: integer }
        max_capacity: { type: integer }
        enrolled_count: { type: integer }
        available_seats: { type: integer, minimum: 0 }
        status: { type: string, enum: [OPEN, CLOSED] }
    RuleFailure:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          enum:
            - ERR_PREREQUISITE_NOT_MET
            - ERR_CREDIT_LIMIT_EXCEEDED
            - ERR_SCHEDULE_CONFLICT
        message: { type: string }
        details: { type: object, additionalProperties: true }
    RuleRejection:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            explanation: { type: string }
            explanation_source: { type: string, enum: [AI, DETERMINISTIC_FALLBACK] }
            failed_rules:
              type: array
              items: { $ref: '#/components/schemas/RuleFailure' }
            details: { type: object, additionalProperties: true }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error_code: { type: string }
        error: { type: string }
        details: { type: object, additionalProperties: true }
    EnrollmentChangedEvent:
      type: object
      required: [event_id, event_name, student_id, section_id, action, event, timestamp, data]
      properties:
        event_id: { type: string, example: evt_1730000000000_abc123 }
        event_name: { type: string, const: enrollment.changed }
        action:
          type: string
          enum: [enrolled, swapped, dropped, withdrawn, overridden]
        timestamp: { type: string, format: date-time }
        student_id: { type: string }
        section_id: { type: string }
        event:
          type: string
          enum: [enrollment.created, enrollment.swapped, enrollment.dropped, enrollment.withdrawn, enrollment.overridden]
        data:
          type: object
          additionalProperties: true
